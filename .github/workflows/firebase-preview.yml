name: Firebase preview
on:
  pull_request:
  push:
    branches: [firebase-migration]
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  preview:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build-hosting.mjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHANUKAH_EXPO }}
          projectId: chanukah-expo
          channelId: pr-games
          expires: 7d
