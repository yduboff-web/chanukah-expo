<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chanukah Expo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --ink:#1B2547; --muted:#58627F; --line:#D3D9E6;
  --gold:#A8761C; --gold-bright:#E6A93A; --gold-soft:#F6EBCF; --olive:#5B6B28; --olive-soft:#E8EDD6;
  --bad:#A33A2A; --bad-soft:#F7E1DC; --good:#3E6B2A; --good-soft:#E2EFD9;
  --seg1:#1B2547; --seg2:#A8761C; --seg3:#5B6B28; --seg-ink:#FFFFFF;
  --night:#1B2547; --night-ink:#F3F5FA;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1528; --surface:#182039; --ink:#E8ECF6; --muted:#A2ACC6; --line:#2C3657;
    --gold:#E3B24F; --gold-bright:#F2C463; --gold-soft:#3A3120; --olive:#B3C278; --olive-soft:#2A3220;
    --bad:#F0927F; --bad-soft:#3D221E; --good:#A9D58E; --good-soft:#22341C;
    --seg1:#2E3B6B; --seg2:#9C7220; --seg3:#56652A; --seg-ink:#FFFFFF;
    --night:#0A0F1E; --night-ink:#F3F5FA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1528; --surface:#182039; --ink:#E8ECF6; --muted:#A2ACC6; --line:#2C3657;
  --gold:#E3B24F; --gold-bright:#F2C463; --gold-soft:#3A3120; --olive:#B3C278; --olive-soft:#2A3220;
  --bad:#F0927F; --bad-soft:#3D221E; --good:#A9D58E; --good-soft:#22341C;
  --seg1:#2E3B6B; --seg2:#9C7220; --seg3:#56652A; --seg-ink:#FFFFFF;
  --night:#0A0F1E; --night-ink:#F3F5FA;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3{font-family:"Frank Ruhl Libre","Times New Roman",serif;line-height:1.15;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold-bright);outline-offset:2px;border-radius:6px}
.wrap{max-width:780px;margin:0 auto;padding:0 20px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:12px 20px;font-weight:600}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:#fff}
.muted{color:var(--muted)}
.hidden{display:none !important}

/* בס״ד badge: fixed top-right on every screen, hidden in print by the print rule below */
.bsd-corner{position:fixed;top:8px;right:12px;z-index:30;color:var(--night-ink);background:rgba(27,37,71,.45);border-radius:6px;padding:2px 7px;font-size:.85rem;line-height:1.4;pointer-events:none}

/* ---------- Login ---------- */
.login{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--night);color:var(--night-ink);padding:32px 20px;text-align:center}
.login h1{font-size:clamp(2.4rem,7vw,3.6rem);font-weight:900;letter-spacing:.01em;margin-top:18px}
.login p{margin:.4rem 0 1.6rem;color:#C7CEE2}
.menorah{width:min(420px,88vw);height:auto;display:block}
.menorah .flame{fill:#F2C463;opacity:0;transform-box:fill-box;transform-origin:50% 100%;transform:scale(.3);transition:opacity .35s ease,transform .35s ease}
.menorah .flame.on{opacity:1;transform:scale(1)}
.menorah .glow{opacity:0;transition:opacity .35s ease}
.menorah .glow.on{opacity:1}
.he{white-space:nowrap}
.code-form{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.code-form input{background:#fff;color:#1B2547;border:0;border-radius:10px;padding:12px 16px;width:220px;font-size:1.2rem;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.code-form input.email{text-transform:none;letter-spacing:normal;text-align:left;width:260px}
.code-form .btn{background:#E6A93A;color:#1B2547}
.err{min-height:1.6em;color:#F6B4A6;margin-top:12px}
.tlink{background:none;border:0;color:#C7CEE2;text-decoration:underline;font-size:.95rem;margin-top:6px;padding:4px}

/* ---------- Dashboard ---------- */
.top{background:var(--night);color:var(--night-ink)}
.top .wrap{padding-top:22px;padding-bottom:24px}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.top-bar .who{color:#C7CEE2;font-size:.95rem}
.top-bar .btn.ghost{color:var(--night-ink);border-color:#3A4570;padding:8px 14px;font-size:.9rem}
.topic-num{font-family:"Frank Ruhl Libre",serif;color:#E6A93A;font-size:1.05rem;font-weight:700}
.topic-title{font-size:clamp(2rem,6vw,3rem);font-weight:900;margin-top:2px}
.topic-about{color:#D7DCEB;margin:.5rem 0 0;font-size:1.05rem}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px 11px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
body.has-tabs::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
main.panel{padding:28px 0 64px}
.section{margin-bottom:30px}
.section h2{font-size:1.45rem;margin-bottom:10px}
.focus{border-left:4px solid var(--gold);padding:4px 0 4px 16px;margin:0 0 26px}
.pages{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.pages li{background:var(--gold-soft);border-radius:8px;padding:6px 12px;font-weight:500}
.slot{border:1.5px dashed var(--line);border-radius:12px;padding:16px 18px;color:var(--muted)}
.reading p{margin:0 0 .9em}
.today{background:var(--olive-soft);border-radius:12px;padding:18px 20px}
.today h2{color:var(--olive);font-size:1.25rem;margin-bottom:6px}
.today p{margin:0;font-size:1.1rem}

/* ---------- Wheel ---------- */
.wheel-area{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:640px){.wheel-area{grid-template-columns:1fr;justify-items:center}}
.wheel-box{position:relative;width:100%;max-width:340px;aspect-ratio:1}
.wheel{width:100%;height:100%;transition:transform 3.6s cubic-bezier(.17,.67,.12,1)}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--gold-bright);filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.wheel text{font-family:"Rubik",sans-serif;font-size:11.5px;font-weight:500;fill:var(--seg-ink)}
.result{min-height:150px}
.result h3{font-size:1.6rem;margin:6px 0 8px}
.ideas-all summary{cursor:pointer;font-weight:500;margin-top:26px}
.ideas-all ul{padding-left:20px}
.ideas-all li{margin:.4em 0}

/* ---------- Quiz ---------- */
.modes{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.modes .btn{padding:9px 16px}
.modes .btn[aria-pressed="false"]{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.q-count{color:var(--muted);font-size:.95rem}
.q-text{font-size:1.35rem;font-family:"Frank Ruhl Libre",serif;font-weight:700;margin:6px 0 16px}
.q-topic{color:var(--gold);font-weight:500;font-size:.95rem}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;font-size:1.02rem}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.feedback{margin:16px 0;font-weight:500}
.score{font-family:"Frank Ruhl Libre",serif;font-size:2.4rem;font-weight:900}
.best{color:var(--muted);font-size:.95rem;margin-top:4px}

/* ---------- Proposal ---------- */
.field{margin-bottom:18px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field .hint{display:block;font-weight:400;color:var(--muted);font-size:.92rem}
.field textarea{width:100%;min-height:92px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.field textarea:focus{border-color:var(--gold);outline:none}
.field textarea[readonly]{background:var(--bg);color:var(--muted)}
.saved{color:var(--muted);font-size:.9rem;margin-left:12px}
.due{background:var(--gold-soft);border-radius:10px;padding:10px 14px;display:inline-block;margin-bottom:22px;font-weight:500}
.chip{display:inline-block;border-radius:999px;padding:4px 14px;font-size:.92rem;font-weight:600;margin-bottom:16px}
.chip.draft{background:var(--gold-soft);color:var(--gold)}
.chip.submitted{background:var(--olive-soft);color:var(--olive)}
.chip.approved{background:var(--good-soft);color:var(--good)}
.chip.changes{background:var(--bad-soft);color:var(--bad)}
.note{border-left:4px solid var(--bad);background:var(--bad-soft);border-radius:0 10px 10px 0;padding:12px 16px;margin:0 0 18px}
.note b{color:var(--bad)}
.prop-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}

/* ---------- Deadlines ---------- */
.dates{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);margin-left:8px}
.dates li{position:relative;padding:0 0 22px 24px}
.dates li::before{content:"";position:absolute;left:-8px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--gold)}
.dates li.past{color:var(--muted)}
.dates li.past::before{background:var(--line);border-color:var(--line)}
.dates li.next::before{background:var(--gold)}
.dates .when{font-weight:600}
.dates .left{color:var(--gold);font-weight:500;margin-left:8px}

/* ---------- Teacher ---------- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tgrid button{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.tgrid button:hover{border-color:var(--gold)}
.tgrid .n{color:var(--gold);font-weight:600;margin-right:6px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.92rem}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--gold-soft)}
.preview-bar{background:var(--gold);color:#fff;text-align:center;padding:8px;font-weight:500}
.preview-bar button{background:#fff;color:#1B2547;border:0;border-radius:8px;padding:4px 10px;margin-left:10px;font-weight:600}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.note-input{width:100%;min-height:70px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;margin:8px 0 12px}

/* ---------- Reading page (Your topic tab) ---------- */
.hx{unicode-bidi:isolate;font-size:1.08em}
.overview{background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:18px 22px;margin:0 0 22px}
.overview h2{font-size:1.1rem;color:var(--gold);margin:0 0 6px}
.overview p{margin:0;font-size:1.15rem;line-height:1.6}
.read-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.read-head h2{font-size:1.45rem;margin:0}
.read-head .btn{padding:8px 14px;font-size:.92rem}
.read{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px clamp(18px,4.5vw,40px) 26px}
.read section{padding-top:22px}
.read section + section{border-top:1px solid var(--line);margin-top:26px}
.read h3{font-family:"Frank Ruhl Libre","Times New Roman",serif;font-size:1.45rem;font-weight:700;margin:0 0 12px}
.read section > p,.read li,.rsec-body > p,.rsec-body li{font-size:1.06rem;line-height:1.75}
.read section > p,.rsec-body > p{margin:0 0 14px;max-width:72ch}
.read a,.cdo a{color:var(--ink);text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:3px}
.read ol,.read ul,.rsec-body > ol,.rsec-body > ul{margin:-6px 0 14px;padding-left:28px}
.read li,.rsec-body li{margin:2px 0}
/* Wide layout: only on the Your topic tab */
body.has-tabs.topic-wide .top .wrap,body.has-tabs.topic-wide .tabs .wrap,body.has-tabs.topic-wide .panel .wrap{max-width:1240px}
.toc{display:none}
@media (min-width:1000px){
  .topic-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;align-items:start}
  .toc{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px)}
}
.toc h2{font-family:"Rubik",system-ui,sans-serif;font-size:.95rem;font-weight:500;color:var(--muted);margin:0 0 8px}
.toc ol{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.toc button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;margin-left:-2px;padding:7px 12px;color:var(--muted);font-size:.95rem;line-height:1.35}
.toc button:hover,.toc button:focus-visible{color:var(--ink);border-left-color:var(--gold)}
.overview,.rsec,.today{scroll-margin-top:74px}
/* Drop-down sections */
.rsecs{display:grid;gap:12px}
.rsec{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.rsec > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:15px 22px;border-radius:13px}
.rsec > summary::-webkit-details-marker{display:none}
.rsec > summary:hover{background:var(--bg)}
.rsec > summary h3{flex:1;margin:0;font-family:"Frank Ruhl Libre","Times New Roman",serif;font-size:1.4rem;font-weight:700}
.rsec > summary::after{content:"";flex:none;width:10px;height:10px;border-right:2.5px solid var(--gold);border-bottom:2.5px solid var(--gold);transform:rotate(45deg);margin:-5px 4px 0 0;transition:transform .2s ease}
.rsec[open] > summary{border-bottom:1px solid var(--line);border-radius:13px 13px 0 0}
.rsec[open] > summary::after{transform:rotate(-135deg);margin-top:5px}
.rsec-body{padding:20px clamp(18px,3vw,34px) 8px}
.rsec .cdo{background:none;border:0;border-radius:0;border-top:1px solid var(--line);padding:16px 0;margin:0}
.rsec .cdo:first-child{border-top:0;padding-top:0}
.read-head .tools{display:flex;gap:8px;flex-wrap:wrap}
.rtable{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:4px 0 16px}
.rtable table{border-collapse:collapse;width:100%;min-width:0}
.rtable th{background:var(--night);color:var(--night-ink);font-weight:600;font-size:.95rem;padding:9px 16px;text-align:left;border:0}
.rtable td{vertical-align:top;padding:12px 16px;border:0;border-top:1px solid var(--line);font-size:1.04rem;line-height:1.65}
.rtable td:first-child{background:var(--bg);width:36%}
.rtable td p{margin:0 0 8px}
.rtable td p:last-child{margin:0}
.rsec-body > p.banner,.read section > p.banner{max-width:none;text-align:center;font-weight:700;font-size:1.25rem;letter-spacing:.02em;margin:6px 0 16px}
.rsec-body > p.gap,.read section > p.gap,.gap{max-width:none;text-align:center;color:var(--muted);letter-spacing:.4em;margin:0 0 14px}
.rtable.multi td:first-child{width:auto}
.rtable.multi th{text-align:center}
.cust{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 16px}
.cust-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:9px 14px;background:var(--night);color:var(--night-ink)}
.cust-head h4{margin:0;font-size:1rem;font-weight:600}
.cust-bar{display:flex;flex-wrap:wrap;gap:6px}
.cust-bar button{border:1.5px solid rgba(255,255,255,.45);background:transparent;color:var(--night-ink);border-radius:999px;padding:4px 12px;font-size:.88rem;line-height:1.3}
.cust-bar button[aria-pressed="true"]{background:var(--gold-bright);border-color:var(--gold-bright);color:#1B2547;font-weight:600}
.cust-body{display:grid;grid-template-columns:1fr 1fr}
.cust-en{grid-column:1;grid-row:1;background:var(--bg);padding:13px 20px;white-space:pre-line;margin:0;font-size:1.04rem;line-height:1.65}
.cust-he{grid-column:2;grid-row:1;padding:10px 20px}
.cust-he p{margin:0 0 8px;direction:rtl;text-align:right;font-family:"Frank Ruhl Libre","Times New Roman",serif;font-weight:500;font-size:1.6rem;line-height:1.85}
.cust [data-k]:not(.on){display:none}
.cust-src{margin:0;padding:8px 18px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.cust-src span{display:block}
@media (max-width:640px){.cust-body{grid-template-columns:1fr}.cust-en,.cust-he{grid-column:1;grid-row:auto}.cust-he p{font-size:1.4rem}}
.rtable.ctr td{text-align:center}
.rtable.multi td:first-child{width:auto;background:none}
.rtable.lbl td:first-child{width:14%;background:var(--bg)}
.rtable.ctr td:first-child{width:auto}
.rsec-body > p.heline,.read section > p.heline{max-width:none;direction:rtl;text-align:center;font-family:"Frank Ruhl Libre","Times New Roman",serif;font-weight:700;font-size:2.3rem;line-height:1.5;margin:4px 0 16px}
.hsrc{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:4px 0 16px}
.hsrc h4{margin:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 18px;font-family:"Frank Ruhl Libre","Times New Roman",serif;font-size:1.25rem;font-weight:700;direction:rtl;text-align:right}
.hsrc p{direction:rtl;text-align:right;margin:0;padding:12px 18px;font-family:"Frank Ruhl Libre","Times New Roman",serif;font-weight:500;font-size:1.4rem;line-height:1.75;white-space:pre-line}
@media (max-width:640px){
  .rtable thead{display:none}
  .rtable table,.rtable tbody,.rtable tr,.rtable td{display:block;width:auto}
  .rtable td:first-child{width:auto}
  .rtable td::before{content:attr(data-h);display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:2px}
}
.src-tag{display:block;margin:-8px 0 16px;font-size:.86rem;color:var(--muted)}
.prayer{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 8px}
.pr-row{display:grid;grid-template-columns:1fr 1fr}
.pr-row + .pr-row{border-top:1px solid var(--line)}
.pr-he{grid-column:2;grid-row:1;direction:rtl;text-align:right;font-family:"Frank Ruhl Libre","Times New Roman",serif;font-weight:500;font-size:1.72rem;line-height:1.8;padding:10px 20px;white-space:pre-line;margin:0}
.pr-en{grid-column:1;grid-row:1;background:var(--bg);padding:13px 20px;font-size:1.04rem;line-height:1.65;white-space:pre-line;margin:0}
.bracha{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 16px;text-align:center}
.bracha h4{margin:0;background:var(--night);color:var(--night-ink);font-weight:600;font-size:1rem;padding:9px 14px}
.br-he{direction:rtl;font-family:"Frank Ruhl Libre","Times New Roman",serif;font-weight:500;font-size:1.9rem;line-height:1.75;white-space:pre-line;margin:0;padding:14px 16px 6px}
.br-en{margin:0 auto;padding:4px 18px 16px;max-width:52ch;font-size:1.02rem;line-height:1.6}
.cdo-list{margin:0;padding:0;list-style:none}
.cdo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin:0 0 14px}
.cdo p{margin:0 0 10px;font-size:1.04rem;line-height:1.7}
.cdo .from{font-size:.95rem;margin:0 0 4px}
.cdo .cites{font-size:.88rem;color:var(--muted);margin:0}

<div class="bsd-corner" lang="he">בס״ד</div>
<div id="app"></div>
<div id="print"></div>

<script src="data.js"></script>
<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

"use strict";
const D = window.EXPO;
import { normalizeCode, groupPassword } from "./group-credentials.mjs";
const GROUP_DOMAIN = "@groups.bha-expo.app";
const fb = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(fb);
const db = initializeFirestore(fb, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const txt = s => esc(s).replace(/[\u05D0-\u05EA][\u05D0-\u05EA\u05F3\u05F4 ]*[\u05D0-\u05EA\u05F3\u05F4]/g, m => `<span class="he">${m}</span>`);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const topicByN = n => D.topics.find(t => t.n === Number(n));
// Classroom topics selected by the teacher. Other readings stay available by code and in teacher preview.
const STUDENT_TOPIC_NUMBERS = new Set([1, 2, 3, 5, 6, 10, 11, 15, 16, 17, 18]);
const studentTopics = () => D.topics.filter(t => STUDENT_TOPIC_NUMBERS.has(t.n));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let state = { group: null, teacher: false, preview: false, tab: "topic", quiz: null, wheelRot: 0,
              proposal: undefined, quizBest: {}, unsub: [], groupSubs: {} };
function clearSubs(){ state.unsub.forEach(u => { try { u(); } catch(e){} }); state.unsub = []; state.groupSubs = {}; }

/* ================= LOGIN ================= */
function menorahSVG(){
  // 8 lights in one straight row at the same height, shamash higher – a kosher menorah
  const xs = [40, 78, 116, 154, 266, 304, 342, 380];
  let s = '<svg class="menorah" viewBox="0 -24 420 254" aria-hidden="true"><defs><radialGradient id="glw"><stop offset="0" stop-color="#F2C463" stop-opacity=".6"/><stop offset="1" stop-color="#F2C463" stop-opacity="0"/></radialGradient></defs>';
  s += '<rect x="30" y="150" width="360" height="9" rx="4" fill="#E6A93A"/>';
  s += '<rect x="205" y="70" width="10" height="132" fill="#E6A93A"/>';
  s += '<path d="M168 214 h84 l-12 -14 h-60 z" fill="#E6A93A"/>';
  xs.forEach((x, i) => {
    s += `<rect x="${x-6}" y="110" width="12" height="40" rx="2" fill="#F3F5FA"/>`;
    s += `<circle class="glow" data-i="${7-i}" cx="${x}" cy="92" r="24" fill="url(#glw)"/>`;
    s += `<path class="flame" data-i="${7-i}" d="M${x} 78 C ${x+9} 92, ${x+7} 106, ${x} 107 C ${x-7} 106, ${x-9} 92, ${x} 78 Z"/>`;
  });
  s += '<rect x="204" y="30" width="12" height="40" rx="2" fill="#F3F5FA"/>';
  s += '<circle class="glow on" cx="210" cy="12" r="24" fill="url(#glw)"/>';
  s += '<path class="flame on" d="M210 -2 C 219 12, 217 26, 210 27 C 203 26, 201 12, 210 -2 Z" transform="translate(0,0)"/>';
  s += '</svg>';
  return s;
}
function lightUp(n){
  document.querySelectorAll(".menorah [data-i]").forEach(el => el.classList.toggle("on", Number(el.dataset.i) < n));
}
function renderLogin(msg, teacherMode){
  clearSubs();
  state = { group: null, teacher: false, preview: false, tab: "topic", quiz: null, wheelRot: 0,
            proposal: undefined, quizBest: {}, unsub: [], groupSubs: {} };
  document.body.classList.remove("has-tabs");
  app.innerHTML = `
    <section class="login">
      ${menorahSVG()}
      <h1>Chanukah Expo</h1>
      <p>${teacherMode ? "Teacher sign in." : "Type your group code to open your page."}</p>
      ${teacherMode ? `
      <form class="code-form" autocomplete="off" style="flex-direction:column;align-items:center">
        <input id="email" name="email" class="email" type="email" aria-label="Email" spellcheck="false" autocomplete="username" placeholder="Email">
        <input id="pass" name="pass" class="email" type="password" aria-label="Password" autocomplete="current-password" placeholder="Password">
        <button class="btn" type="submit">Sign in</button>
      </form>
      <button class="tlink" type="button" id="swap">Back to group code</button>` : `
      <form class="code-form" autocomplete="off">
        <input id="code" name="code" aria-label="Group code" maxlength="32" spellcheck="false" autocapitalize="characters" placeholder="Group code">
        <button class="btn" type="submit">Open</button>
      </form>
      <button class="tlink" type="button" id="swap">Teacher sign in</button>`}
      <p><a class="tlink" href="reading.html">Hebrew reading practice · no login needed</a></p>
      <div class="err" role="alert">${esc(msg || "")}</div>
    </section>`;
  const first = app.querySelector("input");
  first.addEventListener("input", () => lightUp(Math.min(8, first.value.trim().length)));
  app.querySelector("form").addEventListener("submit", e => {
    e.preventDefault();
    if (teacherMode) teacherLogin(app.querySelector("#email").value, app.querySelector("#pass").value);
    else groupLogin(app.querySelector("#code").value);
  });
  app.querySelector("#swap").addEventListener("click", () => renderLogin("", !teacherMode));
  first.focus();
}
function loginError(err){
  const code = err && err.code ? err.code : "";
  if (code === "auth/network-request-failed") return "No connection. Try again when you're online.";
  if (code === "auth/too-many-requests") return "Too many tries. Wait a few minutes and try again.";
  return null;
}
function groupLogin(raw){
  let code;
  try { code = normalizeCode(raw); } catch { renderLogin("Check the code your teacher gave you."); return; }
  signInWithEmailAndPassword(auth, code + GROUP_DOMAIN, groupPassword(code)).catch(err => {
    renderLogin(loginError(err) || "That code doesn't match. Check with your teacher.");
  });
}
function teacherLogin(email, pass){
  if (!email || !pass) return;
  signInWithEmailAndPassword(auth, String(email).trim(), pass).catch(err => {
    renderLogin(loginError(err) || "That email and password don't match.", true);
  });
}
function renderSplash(){
  document.body.classList.remove("has-tabs");
  app.innerHTML = `<section class="login">${menorahSVG()}<h1>Chanukah Expo</h1><p>Opening…</p></section>`;
}

/* ================= DASHBOARD ================= */
const TABS = [["topic","Your topic"],["wheel","Idea wheel"],["quiz","Review game"],["proposal","Proposal"],["dates","Deadlines"]];

function openGroup(g, preview){
  clearSubs();
  state.group = g; state.preview = !!preview; state.tab = "topic"; state.quiz = null; state.wheelRot = 0;
  state.proposal = preview ? null : undefined; state.quizBest = {};
  if (!preview) {
    state.unsub.push(onSnapshot(doc(db, "groups", g.gid, "work", "proposal"), snap => {
      const first = state.proposal === undefined;
      state.proposal = snap.exists() ? snap.data() : null;
      if (state.tab === "proposal") {
        if (first) renderDash();
        else updateProposalStatus();
      }
    }, () => {}));
    loadQuizBest();
  }
  renderDash();
}
function renderDash(){
  const g = state.group, t = topicByN(g.topic);
  document.body.classList.add("has-tabs");
  document.body.classList.toggle("topic-wide", state.tab === "topic");
  const who = state.preview ? "Preview" : `${g.grade ? "Grade " + esc(g.grade) : "Grade not assigned"} · Code ${esc(String(g.code || "").toUpperCase())}`;
  app.innerHTML = `
    ${state.preview ? `<div class="preview-bar">Teacher preview of topic ${t.n} <button type="button" id="back">Back to teacher view</button></div>` : ""}
    <header class="top"><div class="wrap">
      <div class="top-bar"><span class="who">${who}</span>${state.preview ? "" : '<button class="btn ghost" type="button" id="logout">Log out</button>'}</div>
      <div class="topic-num">Topic ${t.n}</div>
      <h1 class="topic-title">${txt(t.name)}</h1>
      <p class="topic-about">${txt(t.about)}</p>
    </div></header>
    <nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist">
      ${TABS.map(([k,l]) => `<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${state.tab===k}">${l}</button>`).join("")}
    </div></nav>
    <main class="panel"><div class="wrap" id="panel"></div></main>`;
  app.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { state.tab = b.dataset.tab; renderDash(); window.scrollTo({top: 0}); }));
  const lo = app.querySelector("#logout"); if (lo) lo.addEventListener("click", () => signOut(auth));
  const bk = app.querySelector("#back"); if (bk) bk.addEventListener("click", renderTeacher);
  const panel = app.querySelector("#panel");
  ({ topic: panelTopic, wheel: panelWheel, quiz: panelQuiz, proposal: panelProposal, dates: panelDates })[state.tab](panel, t);
}

/* ----- Your topic ----- */
function linkify(s){
  return s.split(/(https?:\/\/[^\s]+)/g).map((p, i) => {
    if (i % 2 === 0) return esc(p);
    const m = p.match(/^(.*?)([.,;)\]]*)$/);
    return `<a href="${esc(m[1])}" target="_blank" rel="noopener">${esc(m[1])}</a>${esc(m[2])}`;
  }).join("");
}
/* Hebrew inside English: each Hebrew word or phrase is isolated right-to-left,
   so a line that starts with Hebrew no longer flips the whole paragraph. */
const HE_RUN = /[\u05D0-\u05EA](?:[\u0591-\u05C7\u05D0-\u05EA\u05F3\u05F4]|["'](?=[\u0591-\u05C7\u05D0-\u05EA]))*(?:['\u05F3](?![A-Za-z]))?(?:(?:[ \u00A0]+|-|\u05BE)[\u05D0-\u05EA](?:[\u0591-\u05C7\u05D0-\u05EA\u05F3\u05F4]|["'](?=[\u0591-\u05C7\u05D0-\u05EA]))*(?:['\u05F3](?![A-Za-z]))?)*/g;
function heIso(s){
  s = String(s == null ? "" : s);
  let out = "", last = 0;
  s.replace(HE_RUN, (m, i) => { out += esc(s.slice(last, i)) + `<bdi class="hx" lang="he" dir="rtl">${esc(m)}</bdi>`; last = i + m.length; return m; });
  return out + esc(s.slice(last));
}
function rich(s){
  return String(s).split(/(https?:\/\/[^\s]+)/g).map((p, i) => {
    if (i % 2 === 0) return heIso(p);
    const m = p.match(/^(.*?)([.,;)\]]*)$/);
    return `<a href="${esc(m[1])}" target="_blank" rel="noopener">${esc(m[1])}</a>${esc(m[2])}`;
  }).join("");
}
/* Customs switch for prayers. Texts live in D.customTexts, keyed "<prayer>-<custom>". */
const CUSTOMS = [["ash", "Ashkenaz"], ["sef", "Sefard"], ["ari", "Chabad (Nusach Ari)"], ["edot", "Edot HaMizrach"]];
let curCustom = (() => { const c = store.get("expo:custom"); return CUSTOMS.some(x => x[0] === c) ? c : "ash"; })();
const customLabel = k => (CUSTOMS.find(x => x[0] === k) || ["", ""])[1];
/* Hashem's Names shown the booklet's way (safe to print); cantillation marks hidden. */
function shem(s){
  return String(s).replace(/[\u0591-\u05AF]/g, "")
    .replace(/י[\u05B0-\u05C7]*ה[\u05B0-\u05C7]*ו[\u05B0-\u05C7]*ה[\u05B0-\u05C7]*/g, "יְ-יָ")
    .replace(/יְיָ/g, "יְ-יָ")
    .replace(/(א[\u05B0-\u05C7]*)(?=ל[\u05B0-\u05C7]*ה[\u05B0-\u05C7]*י)/g, "$1-");
}
function customHTML(it){
  const T = D.customTexts || {};
  const have = CUSTOMS.filter(([k]) => T[it.custom + "-" + k]);
  const he = have.map(([k]) => `<div data-k="${k}" class="${k === curCustom ? "on" : ""}">${T[it.custom + "-" + k].he.map(p => `<p lang="he" dir="rtl">${esc(shem(p))}</p>`).join("")}</div>`).join("");
  const src = have.map(([k]) => { const t = T[it.custom + "-" + k]; return `<span data-k="${k}" class="${k === curCustom ? "on" : ""}">Hebrew (${esc(customLabel(k))}): ${esc(t.ref)}, ${esc(t.ver)}, on Sefaria.</span>`; }).join("");
  return `<div class="cust"><div class="cust-head"><h4 dir="ltr">${rich(it.title)}</h4><div class="cust-bar" role="group" aria-label="Custom">${have.map(([k, l]) => `<button type="button" data-cust="${k}" aria-pressed="${k === curCustom}">${esc(l)}</button>`).join("")}</div></div>
    <div class="cust-body"><div class="cust-he">${he}</div><p class="cust-en" dir="ltr">${rich(it.en)}</p></div>
    <p class="cust-src">${src}<span>English: ${rich(it.enSrc)}</span></p></div>`;
}
/* Booklet reading. Each item is either a plain paragraph (a string) or one of:
   { h: "Section heading" }  starts a new drop-down section
   { p: "Paragraph", list: [...], bullets: [...], src: "Source label" }
   { prayer: [["Hebrew line(s)", "English"], ...] }   side by side, as in the booklet
   { bracha: "Label", he: "Hebrew lines", en: "English" } */
function readingSecs(r){
  const secs = [];
  let cur = null;
  const add = html => { if (!cur) { cur = { h: null, body: [] }; secs.push(cur); } cur.body.push(html); };
  r.forEach(it => {
    if (typeof it === "string") return add(`<p dir="ltr">${rich(it)}</p>`);
    if (it.h) { cur = { h: it.h, body: [] }; secs.push(cur); return; }
    if (it.prayer) return add(`<div class="prayer">${it.prayer.map(([he, en]) =>
      `<div class="pr-row"><p class="pr-he" lang="he" dir="rtl">${esc(he)}</p><p class="pr-en" dir="ltr">${rich(en)}</p></div>`).join("")}</div>`);
    if (it.bracha) return add(`<div class="bracha"><h4 dir="ltr">${rich(it.bracha)}</h4><p class="br-he" lang="he" dir="rtl">${esc(it.he)}</p><p class="br-en" dir="ltr">${rich(it.en)}</p></div>`);
    if (it.table) { const hd = it.table.head || []; return add(`<div class="rtable${hd.length > 2 ? " multi" : ""}${it.table.center ? " ctr" : ""}${it.table.label ? " lbl" : ""}"><table dir="ltr">${hd.length ? `<thead><tr>${hd.map(x => `<th>${rich(x)}</th>`).join("")}</tr></thead>` : ""}<tbody>${it.table.rows.map(r => `<tr>${r.map((c, j) => `<td data-h="${esc(hd[j] || "")}">${String(c).split("\n").map(x => `<p>${rich(x)}</p>`).join("")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`); }
    if (it.custom) return add(customHTML(it));
    if (it.banner) return add(`<p class="banner" dir="ltr">${rich(it.banner)}</p>`);
    if (it.heline) return add(`<p class="heline" lang="he" dir="rtl">${esc(it.heline)}</p>`);
    if (it.hsrc) return add(`<div class="hsrc"><h4 lang="he">${esc(it.hsrc.label)}</h4><p lang="he" dir="rtl">${esc(it.hsrc.he)}</p></div>`);
    if (it.gap) return add(`<p class="gap" role="note" aria-label="Part of the text is skipped here">• • •</p>`);
    let h = it.p ? `<p dir="ltr">${rich(it.p)}</p>` : "";
    if (it.list) h += `<ol dir="ltr">${it.list.map(x => `<li>${rich(x)}</li>`).join("")}</ol>`;
    if (it.bullets) h += `<ul dir="ltr">${it.bullets.map(x => `<li>${rich(x)}</li>`).join("")}</ul>`;
    if (it.src) h += `<span class="src-tag">${rich(it.src)}</span>`;
    add(h);
  });
  return secs;
}
/* chabad.org additions: { id, text, title, by, url, cites }. Older plain strings still work. */
function cdoHTML(x){
  return `<ul class="cdo-list">${x.map(c => `<li class="cdo">
      <span class="pid">${esc(c.id)}</span>
      <p dir="ltr">${rich(c.text)}</p>
      <p class="from">From <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>${c.by ? ` by ${esc(c.by)}` : ""}, chabad.org</p>
      <p class="cites">Sources: ${rich(c.cites || "The article gives no specific source for this paragraph.")}</p>
    </li>`).join("")}</ul>`;
}
function panelTopic(panel, t){
  const secs = Array.isArray(t.reading) ? readingSecs(t.reading) : [];
  const ex = Array.isArray(t.extra) ? t.extra : [];
  const exObj = ex.length > 0 && typeof ex[0] === "object";
  const dropdowns = secs.some(s => s.h);
  const menu = [];
  if (t.overview) menu.push(["sec-short", "In short"]);
  let block;
  if (dropdowns) {
    const parts = secs.map((s, i) => {
      const id = "sec-" + (i + 1), title = s.h || "Reading";
      menu.push([id, title]);
      return `<details class="rsec" id="${id}"${i === 0 ? " open" : ""}><summary><h3>${rich(title)}</h3></summary><div class="rsec-body">${s.body.join("")}</div></details>`;
    });
    if (ex.length) {
      menu.push(["sec-cdo", "From chabad.org"]);
      const body = exObj ? cdoHTML(ex) : ex.map(p => `<p dir="ltr">${rich(p)}</p>`).join("");

/* ----- Idea wheel ----- */
function wheelSVG(ideas){
  const n = ideas.length, R = 148, C = 150, seg = 360 / n;
  const pt = a => [C + R * Math.sin(a * Math.PI / 180), C - R * Math.cos(a * Math.PI / 180)];
  let s = `<svg class="wheel" id="wheel" viewBox="0 0 300 300" role="img" aria-label="Idea wheel">`;
  ideas.forEach((idea, i) => {
    const a0 = i * seg, a1 = (i + 1) * seg, mid = a0 + seg / 2;
    const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
    const fill = ["var(--seg1)","var(--seg2)","var(--seg3)"][i % 3];
    s += `<path d="M${C} ${C} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${seg > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${fill}" stroke="var(--surface)" stroke-width="2"/>`;
    if (mid < 180) s += `<text x="${C + 30}" y="${C}" dominant-baseline="middle" transform="rotate(${mid - 90} ${C} ${C})">${esc(idea.short)}</text>`;
    else s += `<text x="${C - 30}" y="${C}" dominant-baseline="middle" text-anchor="end" transform="rotate(${mid + 90} ${C} ${C})">${esc(idea.short)}</text>`;
  });
  s += `<circle cx="${C}" cy="${C}" r="22" fill="var(--surface)" stroke="var(--gold)" stroke-width="3"/></svg>`;
  return s;
}
function panelWheel(panel, t){
  panel.innerHTML = `
    <div class="wheel-area">
      <div class="wheel-box"><div class="pointer"></div>${wheelSVG(t.ideas)}</div>
      <div class="result" id="result" aria-live="polite">
        <h2>Need a booth idea?</h2>
        <p class="muted">Spin the wheel for an idea that fits your topic. Spin as many times as you want.</p>
        <button class="btn gold" type="button" id="spin">Spin</button>
      </div>
    </div>
    <details class="ideas-all"><summary>See all the ideas</summary>
      <ul>${t.ideas.map(i => `<li><b>${txt(i.short)}:</b> ${txt(i.how)}</li>`).join("")}</ul>
    </details>
    <p class="muted">Have your own idea? Put it in your proposal.</p>`;
  const wheel = panel.querySelector("#wheel");
  wheel.style.transform = `rotate(${state.wheelRot}deg)`;
  let spinning = false;
  const spin = () => {
    if (spinning) return;
    spinning = true;
    const n = t.ideas.length, seg = 360 / n, pick = Math.floor(Math.random() * n);
    const mid = pick * seg + seg / 2;
    const jitter = (Math.random() - 0.5) * seg * 0.6;
    const k = Math.ceil(state.wheelRot / 360) + 5;
    state.wheelRot = k * 360 - mid + jitter;
    wheel.style.transform = `rotate(${state.wheelRot}deg)`;
    const done = () => {
      const idea = t.ideas[pick];
      panel.querySelector("#result").innerHTML = `
        <div class="q-topic">Your idea</div>
        <h3>${txt(idea.short)}</h3>
        <p>${txt(idea.how)}</p>
        <button class="btn gold" type="button" id="spin">Spin again</button>`;
      panel.querySelector("#spin").addEventListener("click", spin);
      spinning = false;
    };
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(done, reduce ? 450 : 3700);
  };
  panel.querySelector("#spin").addEventListener("click", spin);
}

/* ----- Review game ----- */
function newQuiz(mode, t){
  let pool;
  if (mode === "all") pool = shuffle(studentTopics().flatMap(tp => tp.quiz.map(q => Object.assign({ topic: tp }, q)))).slice(0, 10);
  else pool = shuffle(t.quiz.map(q => Object.assign({ topic: t }, q)));
  return { mode, items: pool.map(q => Object.assign({}, q, { opts: shuffle([q.a].concat(q.w)) })), i: 0, score: 0, answered: false, saved: false };
}
function loadQuizBest(){
  getDocs(collection(db, "groups", state.group.gid, "quiz")).then(qs => {
    const best = {};
    qs.forEach(d => {
      const q = d.data();
      if (q.total > 0) {
        const frac = q.score / q.total;
        if (!best[q.mode] || frac > best[q.mode].frac) best[q.mode] = { frac, score: q.score, total: q.total };
      }
    });
    state.quizBest = best;
    if (state.tab === "quiz" && state.quiz && state.quiz.i >= state.quiz.items.length) {
      const panel = document.querySelector("#panel");
      if (panel) panelQuiz(panel, topicByN(state.group.topic));
    }
  }).catch(() => {});
}
function bestLine(mode){
  const b = state.quizBest[mode];
  return b ? `Your best: ${b.score} of ${b.total}` : "";
}
function panelQuiz(panel, t){
  if (!state.quiz) state.quiz = newQuiz("mine", t);
  const Q = state.quiz;
  const modes = `<div class="modes" role="group" aria-label="Which questions">
      <button class="btn" type="button" data-mode="mine" aria-pressed="${Q.mode==="mine"}">My topic</button>
      <button class="btn" type="button" data-mode="all" aria-pressed="${Q.mode==="all"}">Whole expo</button>
    </div>`;
  if (Q.i >= Q.items.length) {
    const total = Q.items.length;
    if (!Q.saved && !state.preview) {
      Q.saved = true;
      addDoc(collection(db, "groups", state.group.gid, "quiz"),
        { score: Q.score, total, mode: Q.mode, at: serverTimestamp() })
        .then(loadQuizBest).catch(() => {});
    }
    const line = Q.score === total ? "Every one right. You’re ready." : Q.score >= total * 0.7 ? "Nice work. Review the ones you missed." : "Go back to the booklet pages and try again.";
    const best = bestLine(Q.mode);
    panel.innerHTML = `${modes}
      <div class="score">${Q.score} of ${total}</div>
      ${best ? `<div class="best">${esc(best)}</div>` : ""}
      <p>${line}</p>
      <button class="btn gold" type="button" id="again">Play again</button>`;
    panel.querySelector("#again").addEventListener("click", () => { state.quiz = newQuiz(Q.mode, t); panelQuiz(panel, t); });
  } else {
    const q = Q.items[Q.i];
    panel.innerHTML = `${modes}
      <div class="q-count">Question ${Q.i + 1} of ${Q.items.length}</div>
      ${Q.mode === "all" ? `<div class="q-topic">Topic ${q.topic.n}: ${txt(q.topic.name)}</div>` : ""}
      <div class="q-text">${txt(q.q)}</div>
      <div class="opts">${q.opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">${txt(o)}</button>`).join("")}</div>
      <div class="feedback" id="fb" aria-live="polite"></div>
      <button class="btn hidden" type="button" id="next">${Q.i + 1 < Q.items.length ? "Next question" : "See my score"}</button>`;
    panel.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if (Q.answered) return;
      Q.answered = true;
      const pickTxt = q.opts[Number(b.dataset.k)], right = pickTxt === q.a;
      if (right) Q.score++;
      panel.querySelectorAll(".opt").forEach(x => {
        x.disabled = true;
        const txt2 = q.opts[Number(x.dataset.k)];
        if (txt2 === q.a) x.classList.add("right");
        else if (x === b) x.classList.add("wrong");
      });
      panel.querySelector("#fb").textContent = (right ? "Right! " : "Not quite. ") + (q.p ? `It’s on ${q.p}.` : "");
      const nx = panel.querySelector("#next"); nx.classList.remove("hidden"); nx.focus();
    }));
    panel.querySelector("#next").addEventListener("click", () => { Q.i++; Q.answered = false; panelQuiz(panel, t); });
  }
  panel.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { state.quiz = newQuiz(b.dataset.mode, t); panelQuiz(panel, t); }));
}

const FIELDS = [

const STATUS_LABEL = { draft: "Draft", submitted: "Submitted – waiting for your teacher", approved: "Approved", changes: "Needs changes" };
function propKey(){ return "expo:proposal:PREVIEW-" + state.group.topic; }
function loadPreviewProp(){ try { return JSON.parse(store.get(propKey()) || "{}"); } catch(e){ return {}; } }
function fmtDate(iso){
  if (!iso) return "Date coming";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}
function propRef(){ return doc(db, "groups", state.group.gid, "work", "proposal"); }
function panelProposal(panel, t){
  const dl = D.deadlines[D.proposalDeadline];
  const dueLine = dl ? `<div class="due">Due ${esc(fmtDate(dl.date))}</div>` : "";
  const intro = `<p class="muted">Topic ${t.n}: ${txt(t.name)}. Your teacher approves every proposal before you start building.</p>`;

  if (state.preview) {
    const data = loadPreviewProp();
    panel.innerHTML = `${dueLine}${intro}
      ${FIELDS.map(([k, l, h]) => `<div class="field"><label for="f-${k}">${l}<span class="hint">${h}</span></label><textarea id="f-${k}" data-k="${k}">${esc(data[k] || "")}</textarea></div>`).join("")}
      <div class="prop-actions"><button class="btn gold" type="button" id="print-btn">Print proposal</button><span class="saved" id="saved">Preview – saves only on this computer.</span></div>`;
    let timer;
    panel.querySelectorAll("textarea").forEach(ta => ta.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => {

        panel.querySelector("#saved").textContent = "Saved on this computer.";
      }, 300);
    }));
    panel.querySelector("#print-btn").addEventListener("click", () => printProposal(panel, t));
    return;
  }

  if (state.proposal === undefined) { panel.innerHTML = `<p class="muted">Loading…</p>`; return; }
  const data = state.proposal || {};
  panel.innerHTML = `${dueLine}${intro}
    <div id="status-area"></div>
    ${FIELDS.map(([k, l, h]) => `<div class="field"><label for="f-${k}">${l}<span class="hint">${h}</span></label><textarea id="f-${k}" data-k="${k}">${esc(data[k] || "")}</textarea></div>`).join("")}
    <div class="prop-actions">
      <button class="btn gold" type="button" id="submit-btn">Submit for approval</button>
      <button class="btn ghost" type="button" id="print-btn">Print proposal</button>
      <span class="saved" id="saved"></span>
    </div>`;
  updateProposalStatus();

  let timer;
  const save = () => {
    const d = {};
    panel.querySelectorAll("textarea").forEach(ta => d[ta.dataset.k] = ta.value.slice(0, 4000));
    const cur = (state.proposal && state.proposal.status) || "draft";
    const status = cur === "changes" ? "draft" : cur;
    panel.querySelector("#saved").textContent = "Saving…";
    setDoc(propRef(), Object.assign(d, { status, updatedAt: serverTimestamp() }), { merge: true })
      .then(() => { const s = panel.querySelector("#saved"); if (s) s.textContent = "Saved."; })
      .catch(() => { const s = panel.querySelector("#saved"); if (s) s.textContent = "Not saved – check your connection."; });
  };
  panel.querySelectorAll("textarea").forEach(ta => ta.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(save, 1000);
  }));
  panel.querySelector("#submit-btn").addEventListener("click", () => {
    clearTimeout(timer);
    const d = {};
    panel.querySelectorAll("textarea").forEach(ta => d[ta.dataset.k] = ta.value.slice(0, 4000));
    const btn = panel.querySelector("#submit-btn");
    btn.disabled = true; btn.textContent = "Submitting…";
    setDoc(propRef(), Object.assign(d, { status: "submitted", updatedAt: serverTimestamp() }), { merge: true })
      .catch(() => { btn.disabled = false; btn.textContent = "Submit for approval"; });
  });
  panel.querySelector("#print-btn").addEventListener("click", () => printProposal(panel, t));
}
function updateProposalStatus(){
  const area = document.querySelector("#status-area");
  if (!area) return;
  const p = state.proposal || {};
  const status = p.status || "draft";
  const locked = status === "approved";
  area.innerHTML = `<span class="chip ${esc(status)}">${esc(STATUS_LABEL[status] || status)}</span>` +
    (status === "changes" && p.teacherNote ? `<div class="note"><b>From your teacher:</b> ${esc(p.teacherNote)}</div>` : "");
  document.querySelectorAll("#panel textarea").forEach(ta => ta.readOnly = locked);
  const sb = document.querySelector("#submit-btn");
  if (sb) {
    sb.classList.toggle("hidden", !(status === "draft" || status === "changes"));
    sb.disabled = false; sb.textContent = "Submit for approval";
  }
  const saved = document.querySelector("#saved");
  if (saved && !saved.textContent) saved.textContent = locked ? "Approved – locked." : "Saves online as you type.";
}
function printProposal(panel, t){

/* ----- Deadlines ----- */
function panelDates(panel){
  const today = new Date(); today.setHours(0,0,0,0);
  let nextMarked = false;
  const items = D.deadlines.map(d => {
    let cls = "", left = "";
    if (d.date) {
      const day = new Date(d.date + "T00:00:00");
      const diff = Math.round((day - today) / 86400000);
      if (diff < 0) cls = "past";
      else {
        left = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : `In ${diff} days`;
        if (!nextMarked) { cls = "next"; nextMarked = true; }
      }
    }
    return `<li class="${cls}"><span class="when">${esc(fmtDate(d.date))}</span>${left ? `<span class="left">${left}</span>` : ""}<br>${esc(d.what)}</li>`;
  }).join("");
  panel.innerHTML = `<div class="section"><h2>Deadlines</h2></div><ul class="dates">${items}</ul>`;
}

    <main class="panel"><div class="wrap">
      <div class="section"><h2>Groups</h2>
        <div class="table-wrap"><table><thead><tr><th>Code</th><th>Grade</th><th>Topic</th><th>Proposal</th><th>Updated</th><th>Best quiz</th></tr></thead><tbody id="trows"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody></table></div>
      </div>
      <div id="detail"></div>
      <div class="section"><h2>Preview a topic</h2>
        <p class="muted">Opens the page a group with that topic will see.</p>
        <div class="tgrid">${D.topics.map(t => `<button type="button" data-n="${t.n}"><span class="n">${t.n}</span>${txt(t.name)}</button>`).join("")}</div>
      </div>
    </div></main>`;
  app.querySelector("#logout").addEventListener("click", () => signOut(auth));
  app.querySelectorAll(".tgrid button").forEach(b => b.addEventListener("click", () => {
    openGroup({ gid: "", code: "PREVIEW", grade: "", topic: Number(b.dataset.n) }, true);
    window.scrollTo({ top: 0 });
  }));
  state.unsub.push(onSnapshot(collection(db, "groups"), qs => {
    const groups = qs.docs.map(d => {
      const existing = (state.groups || []).find(g => g.gid === d.id);
      return Object.assign(existing || { gid: d.id }, d.data());
    });
    groups.sort((a, b) => (a.grade - b.grade) || String(a.code).localeCompare(String(b.code)));
    state.groups = groups;
    const seen = {};
    groups.forEach(g => {
      seen[g.gid] = true;
      if (!state.groupSubs[g.gid]) {
        const subs = [
          onSnapshot(doc(db, "groups", g.gid, "work", "proposal"), s => {
            g.proposal = s.exists() ? s.data() : null; renderGroupRows();
          }, () => {}),
          onSnapshot(collection(db, "groups", g.gid, "quiz"), s => {
            let best = null;
            s.forEach(d => { const q = d.data(); if (q.total > 0) { const f = q.score / q.total; if (!best || f > best.frac) best = { frac: f, score: q.score, total: q.total }; } });
            g.best = best; renderGroupRows();
          }, () => {})
        ];
        state.groupSubs[g.gid] = subs;
        state.unsub.push(...subs);
      }
    });
    Object.keys(state.groupSubs).forEach(gid => { if (!seen[gid]) { state.groupSubs[gid].forEach(u => u()); delete state.groupSubs[gid]; } });
    const tc = app.querySelector("#tcount");
    if (tc) tc.textContent = `${groups.length} groups, ${D.topics.length} topics`;
    renderGroupRows();
  }, err => {
    const tc = app.querySelector("#tcount");
    if (tc) tc.textContent = "Could not load groups: " + (err && err.message ? err.message : "error");
  }));
}
function renderGroupRows(){
  const body = app.querySelector("#trows");
  if (!body || !state.groups) return;
  if (!state.groups.length) { body.innerHTML = `<tr><td colspan="6" class="muted">No groups yet.</td></tr>`; return; }
  body.innerHTML = state.groups.map(g => {
    const t = topicByN(g.topic);
    const p = g.proposal;
    const status = p ? (STATUS_LABEL[p.status] || p.status || "Draft").split(" ")[0] : "–";
    const updated = p && p.updatedAt && p.updatedAt.toDate ? p.updatedAt.toDate().toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "–";
    const best = g.best ? `${g.best.score}/${g.best.total}` : "–";
    return `<tr class="clickable" data-gid="${esc(g.gid)}"><td><b>${esc(String(g.code || "").toUpperCase())}</b></td><td>${g.grade ? esc(g.grade) : "Not assigned"}</td><td>${t ? t.n + ". " + txt(t.name) : "?"}</td><td>${esc(status)}</td><td>${esc(updated)}</td><td>${esc(best)}</td></tr>`;
  }).join("");
  body.querySelectorAll("tr.clickable").forEach(r => r.addEventListener("click", () => renderTeacherDetail(r.dataset.gid)));
  if (state.detail) renderTeacherDetail(state.detail);
}
function renderTeacherDetail(gid){
  state.detail = gid;
  const g = (state.groups || []).find(x => x.gid === gid);
  const box = app.querySelector("#detail");
  if (!g || !box) return;
  const t = topicByN(g.topic);
  const p = g.proposal || {};
  const status = p.status || "draft";
  box.innerHTML = `
    <div class="section">
      <h2>Group ${esc(String(g.code || "").toUpperCase())} - ${g.grade ? "Grade " + esc(g.grade) : "Grade not assigned"}${t ? `, Topic ${t.n}: ${txt(t.name)}` : ""}</h2>
      <span class="chip ${esc(status)}">${esc(STATUS_LABEL[status] || status)}</span>
      ${p.teacherNote && status === "changes" ? `<div class="note"><b>Your note:</b> ${esc(p.teacherNote)}</div>` : ""}
      ${FIELDS.map(([k, l]) => `<div class="field"><label>${l}</label><div class="slot" style="color:var(--ink);white-space:pre-wrap">${esc(p[k] || "") || "–"}</div></div>`).join("")}
      <label for="tnote"><b>Send back with a note</b></label>
      <textarea id="tnote" class="note-input" placeholder="What should they change?">${esc(status === "changes" ? (p.teacherNote || "") : "")}</textarea>
      <div class="detail-actions">
        <button class="btn gold" type="button" id="approve">Approve</button>
        <button class="btn" type="button" id="sendback">Send back</button>
        <button class="btn ghost" type="button" id="tprint">Print proposal</button>
      </div>
      <div class="err" id="terr" role="alert"></div>
    </div>`;
  box.querySelector("#approve").addEventListener("click", () => {
    updateDoc(doc(db, "groups", gid, "work", "proposal"), { status: "approved", updatedAt: serverTimestamp() })
      .catch(e => { box.querySelector("#terr").textContent = "Not saved: " + e.message; });
  });
  box.querySelector("#sendback").addEventListener("click", () => {
    const note = box.querySelector("#tnote").value.trim();
    if (!note) { box.querySelector("#terr").textContent = "Write a note first."; return; }
    updateDoc(doc(db, "groups", gid, "work", "proposal"), { status: "changes", teacherNote: note, updatedAt: serverTimestamp() })
      .catch(e => { box.querySelector("#terr").textContent = "Not saved: " + e.message; });
  });
  box.querySelector("#tprint").addEventListener("click", () => {
    document.getElementById("print").innerHTML = `
      <p class="bsd">בס״ד</p>
      <h1>Chanukah Expo Proposal</h1>
      <p class="row"><b>Names:</b> ______________________</p>
      <p class="row"><b>Grade:</b> ${esc(g.grade || "")} &nbsp; <b>Group code:</b> ${esc(String(g.code || "").toUpperCase())}</p>
      <p class="row"><b>Topic:</b> ${t ? t.n + ". " + esc(t.name) : "?"}</p>
      ${FIELDS.map(([k, l]) => `<p class="row"><b>${l}</b></p><div class="box">${esc(p[k] || "")}</div>`).join("")}
      <p class="row"><b>Approved:</b> ______________________</p>`;
    window.print();
  });
}

/* ================= START ================= */
renderSplash();
onAuthStateChanged(auth, user => {
  if (!user) { renderLogin(); return; }
  const email = (user.email || "").toLowerCase();
  if (email.endsWith(GROUP_DOMAIN)) {
    const gid = email.slice(0, -GROUP_DOMAIN.length);
    getDoc(doc(db, "groups", gid)).then(snap => {
      if (!snap.exists()) {
        signOut(auth).then(() => renderLogin("That code isn't set up yet. Check with your teacher."));
        return;
      }
      const g = Object.assign({ gid }, snap.data());
      if (!state.group || state.group.gid !== gid || state.preview) openGroup(g, false);
    }).catch(() => renderLogin("No connection. Try again when you're online."));
  } else {
    renderTeacher();
  }
});
</script>
